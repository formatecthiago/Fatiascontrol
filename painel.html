<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Gerente Controlador</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow-y: auto; }
        
        .grid-ampliado { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .grid-ampliado .m { height: 135px; }

        .grid-geral { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 6px; }
        .grid-geral .m { height: 95px; padding: 4px; }

        /* Estado Padrão: Translúcido */
        .m { background: rgba(15, 23, 42, 0.4); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); opacity: 0.35; transition: all 0.3s ease; }
        .m.ativa-no-mapa { opacity: 1 !important; }

        /* Estados de Cores por Tempo */
        .verde-novo { background: #15803d !important; border-color: #22c55e !important; }
        .amarelo-alerta { background: #b45309 !important; border-color: #f59e0b !important; }
        .vermelho-critico { background: #b91c1c !important; border-color: #f87171 !important; }
        .vermelho-pulsando { background: #991b1b !important; border-color: #ef4444 !important; animation: pulse 0.8s infinite; }
        .verde-atendido { background: #064e3b !important; border-color: #059669 !important; opacity: 0.85 !important; }

        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.97); } }
        #setup-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        #modal-msg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    </style>
</head>
<body class="p-4">
    <div id="setup-overlay" onclick="ativarPainel()">
        <div class="px-8 py-4 border-2 border-[#E6B952] rounded-full animate-pulse font-bold text-[#E6B952]">
            ATIVAR MONITORAMENTO E SOM
        </div>
    </div>

    <!-- Modal para Enviar Mensagem Personalizada ao Cliente -->
    <div id="modal-msg">
        <div class="bg-gray-900 border-2 border-[#E6B952] p-6 rounded-2xl w-11/12 max-w-md text-center">
            <h2 class="text-[#E6B952] font-black text-lg mb-2">ENVIAR MENSAGEM - MESA <span id="msg-num-mesa">--</span></h2>
            <div class="flex flex-col gap-2 mb-4">
                <button onclick="enviarFrase('Garçom a caminho!')" class="bg-blue-800 hover:bg-blue-700 text-white text-xs py-2 rounded font-bold">🚶‍♂️ Garçom a caminho!</button>
                <button onclick="enviarFrase('Sua conta está sendo impressa.')" class="bg-green-800 hover:bg-green-700 text-white text-xs py-2 rounded font-bold">🧾 Sua conta está sendo impressa.</button>
                <button onclick="enviarFrase('Pedido em preparação, já atendemos você!')" class="bg-amber-800 hover:bg-amber-700 text-white text-xs py-2 rounded font-bold">🍕 Pedido em preparação!</button>
            </div>
            <input type="text" id="input-msg-custom" placeholder="Ou digite uma mensagem..." class="w-full bg-black border border-gray-700 rounded p-2 text-white text-xs mb-4 outline-none focus:border-[#E6B952]">
            <div class="flex justify-between gap-2">
                <button onclick="fecharModalMsg()" class="w-1/2 bg-gray-700 text-white text-xs py-2 rounded font-bold">Cancelar</button>
                <button onclick="enviarMsgCustomizada()" class="w-1/2 bg-[#E6B952] text-black text-xs py-2 rounded font-bold">Enviar</button>
            </div>
        </div>
    </div>

    <header class="flex flex-wrap justify-between items-center gap-2 mb-4">
        <h1 class="text-xl font-bold uppercase">MAPA <span style="color:#E6B952">FATIAS CONTROL</span></h1>
        <div class="flex gap-2">
            <button id="btn-filtro" onclick="alternarFiltro()" class="bg-indigo-700 hover:bg-indigo-600 text-white px-3 py-2 rounded text-xs font-bold transition">
                👁️ <span>Apenas Ativas</span>
            </button>
            <button id="btn-zoom" onclick="alternarZoom()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded text-xs font-bold transition">
                🔍 <span>Visão Geral</span>
            </button>
            <button onclick="sair()" class="bg-red-900 hover:bg-red-800 p-2 rounded text-xs font-bold">Sair</button>
        </div>
    </header>

    <div id="grid" class="grid-ampliado"></div>
    <audio id="som" src="alerta.mp3" preload="auto"></audio>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAf196vm_BP28YJWnATut2at74PfDqXleg",
            authDomain: "service-controll.firebaseapp.com",
            databaseURL: "https://service-controll-default-rtdb.firebaseio.com",
            projectId: "service-controll",
            storageBucket: "service-controll.firebasestorage.app",
            messagingSenderId: "568413588202",
            appId: "1:568413588202:web:a0fc12f49cc10bfc482593",
            measurementId: "G-9DJW6KWLFG"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let chamadosAtivos = {};
        let modoGeral = false;
        let apenasAtivas = false;
        let totalChamadosAntigo = 0;
        let mesaSelecionadaMsg = null;
        const som = document.getElementById('som');

        // Atualiza a tela a cada 1 segundo para atualizar o contador de tempo das cores
        setInterval(() => { desenharGrade(); }, 1000);

        function alternarZoom() {
            modoGeral = !modoGeral;
            document.getElementById('grid').className = modoGeral ? "grid-geral" : "grid-ampliado";
            document.getElementById('btn-zoom').innerHTML = modoGeral ? "🔍 <span>Ampliar</span>" : "🔍 <span>Visão Geral</span>";
            desenharGrade();
        }

        function alternarFiltro() {
            apenasAtivas = !apenasAtivas;
            document.getElementById('btn-filtro').innerHTML = apenasAtivas ? "👁️ <span>Todas as Mesas</span>" : "👁️ <span>Apenas Ativas</span>";
            desenharGrade();
        }

        function desenharGrade() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const agora = Date.now();

            for(let i = 1; i <= 50; i++) {
                const c = chamadosAtivos[i];
                const estaPendente = c && c.status === 'pendente';
                const foiAtendido = c && c.status === 'atendido';
                
                // Regra de permanência de 10 minutos (600.000 ms)
                const dentroDos10Min = foiAtendido && c.timestampAtendimento && (agora - c.timestampAtendimento < 600000);

                let classeCor = "";
                let tempoDecorridoSeg = 0;

                if (estaPendente) {
                    tempoDecorridoSeg = Math.floor((agora - c.timestamp) / 1000);
                    if (tempoDecorridoSeg <= 40) classeCor = "verde-novo ativa-no-mapa";
                    else if (tempoDecorridoSeg <= 90) classeCor = "amarelo-alerta ativa-no-mapa";
                    else if (tempoDecorridoSeg <= 120) classeCor = "vermelho-critico ativa-no-mapa";
                    else classeCor = "vermelho-pulsando ativa-no-mapa";
                } else if (dentroDos10Min) {
                    classeCor = "verde-atendido ativa-no-mapa";
                }

                // Se o filtro 'Apenas Ativas' estiver ligado, esconde mesas translúcidas
                if (apenasAtivas && !estaPendente && !dentroDos10Min) {
                    continue;
                }

                const div = document.createElement('div');
                div.className = `m p-2 flex flex-col items-center justify-between ${classeCor}`;
                
                let textoFicha = (c && c.ficha) ? `<span class="text-[9px] bg-black/70 px-1 rounded text-yellow-300 font-black">F: ${c.ficha}</span>` : '';
                let tempoTexto = estaPendente ? `<span class="text-[9px] font-mono font-bold">${tempoDecorridoSeg}s</span>` : '';

                div.innerHTML = `
                    <div class="flex justify-between w-full items-center">
                        <span class="text-[10px] font-bold">MESA ${i}</span>
                        ${tempoTexto}
                    </div>

                    ${estaPendente ? `
                        <div class="text-center flex flex-col items-center my-1">
                            <span class="text-[8px] uppercase font-bold">${c.acao}</span>${textoFicha}
                        </div>
                        <div class="flex flex-col gap-1 w-full">
                            <div class="flex gap-1 w-full">
                                <button onclick="atender(${i})" class="bg-blue-600 text-[8px] p-1 rounded font-bold hover:bg-blue-500 w-1/2">OK</button>
                                <button onclick="abrirModalMsg(${i})" class="bg-amber-600 text-[8px] p-1 rounded font-bold hover:bg-amber-500 w-1/2">💬</button>
                            </div>
                            <button onclick="limpar(${i})" class="bg-black text-[8px] p-0.5 rounded border border-gray-600 uppercase hover:bg-gray-800">Limpar</button>
                        </div>
                    ` : dentroDos10Min ? `
                        <span class="text-[8px] text-green-300 font-bold">ATENDIDA</span>
                        <button onclick="abrirModalMsg(${i})" class="bg-amber-600 text-[8px] p-1 rounded font-bold hover:bg-amber-500 w-full mb-1">💬 Msg</button>
                    ` : '<span class="text-[8px] opacity-40">LIVRE</span>'}
                `;
                grid.appendChild(div);
            }
        }

        function ativarPainel() {
            som.play().then(() => { som.pause(); som.currentTime = 0; }).catch(() => {});
            document.getElementById('setup-overlay').style.display = 'none';
            iniciarEscutaFirebase();
        }

        function sair() { if(confirm("Encerrar Painel?")) window.location.href = "about:blank"; }

        function iniciarEscutaFirebase() {
            db.ref('chamados').on('value', (snapshot) => {
                chamadosAtivos = snapshot.val() || {};
                
                let totalPendentes = 0;
                Object.values(chamadosAtivos).forEach(item => {
                    if (item.status === 'pendente') totalPendentes++;
                });

                if (totalPendentes > totalChamadosAntigo) {
                    som.currentTime = 0;
                    som.play().catch(() => {});
                }
                totalChamadosAntigo = totalPendentes;

                desenharGrade();
            });
        }

        function atender(numMesa) {
            db.ref('chamados/' + numMesa).update({ 
                status: 'atendido',
                timestampAtendimento: Date.now()
            });
        }

        function limpar(numMesa) {
            db.ref('chamados/' + numMesa).remove();
        }

        /* Funções de Envio de Mensagem ao Cliente */
        function abrirModalMsg(numMesa) {
            mesaSelecionadaMsg = numMesa;
            document.getElementById('msg-num-mesa').innerText = numMesa;
            document.getElementById('input-msg-custom').value = '';
            document.getElementById('modal-msg').style.display = 'flex';
        }

        function fecharModalMsg() {
            document.getElementById('modal-msg').style.display = 'none';
            mesaSelecionadaMsg = null;
        }

        function enviarFrase(texto) {
            if(!mesaSelecionadaMsg) return;
            db.ref('chamados/' + mesaSelecionadaMsg).update({ mensagemGerente: texto });
            fecharModalMsg();
        }

        function enviarMsgCustomizada() {
            const texto = document.getElementById('input-msg-custom').value.trim();
            if(texto && mesaSelecionadaMsg) {
                db.ref('chamados/' + mesaSelecionadaMsg).update({ mensagemGerente: texto });
                fecharModalMsg();
            }
        }

        desenharGrade();
    </script>
</body>
</html>
