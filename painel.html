<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Jesus - Fatia's Control</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
        .m { background: #064e3b; height: 120px; border-radius: 8px; border: 1px solid #065f46; }
        .ativa { background: #b91c1c !important; border-color: #f87171; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        #setup-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body class="p-4">
    <div id="setup-overlay" onclick="ativarPainel()">
        <div class="px-8 py-4 border-2 border-[#E6B952] rounded-full animate-pulse font-bold text-[#E6B952]">
            ATIVAR MONITORAMENTO E SOM
        </div>
    </div>

    <header class="flex justify-between items-center mb-4">
        <h1 class="text-xl font-bold uppercase">MAPA <span style="color:#E6B952">FATIAS CONTROL</span></h1>
        <div class="flex gap-2">
            <button onclick="minimizar()" class="bg-gray-800 p-2 rounded text-[10px] font-bold">Minimizar</button>
            <button onclick="sair()" class="bg-red-900 p-2 rounded text-[10px] font-bold">Sair</button>
        </div>
    </header>

    <div id="grid" class="grid"></div>
    <audio id="som" src="alerta.mp3" preload="auto"></audio>

    <script>
        // Utiliza a API Serverless (Netlify/GitHub Functions)
        const API_URL = "/.netlify/functions/api";

        let estadoMesas = {};
        for(let i = 1; i <= 50; i++) {
            estadoMesas[i] = { ativa: false, acao: '', quantidade: 0 };
        }

        let ultimoTotal = 0;
        const som = document.getElementById('som');

        function desenharGrade() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for(let i = 1; i <= 50; i++) {
                const m = estadoMesas[i] || { ativa: false, acao: '', quantidade: 0 };
                const div = document.createElement('div');
                div.className = `m p-2 flex flex-col items-center justify-between ${m.ativa ? 'ativa' : ''}`;
                div.innerHTML = `
                    <span class="text-[10px] font-bold">MESA ${i}</span>
                    ${m.ativa ? `
                        <span class="text-[8px] uppercase text-center font-bold">${m.acao}<br>(${m.quantidade}x)</span>
                        <div class="flex flex-col gap-1 w-full">
                            <button onclick="atender(${i})" class="bg-blue-600 text-[8px] p-1 rounded font-bold">OK</button>
                            <button onclick="limpar(${i})" class="bg-black text-[8px] p-1 rounded border border-gray-600 uppercase">Limpar</button>
                        </div>
                    ` : '<span class="text-[8px] opacity-40">LIVRE</span>'}
                `;
                grid.appendChild(div);
            }
        }

        function ativarPainel() { 
            som.play().then(() => { som.pause(); som.currentTime = 0; }).catch(() => {});
            document.documentElement.requestFullscreen().catch(() => {});
            document.getElementById('setup-overlay').style.display = 'none';
            atualizar();
        }

        function minimizar() { if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); document.getElementById('setup-overlay').style.display = 'flex'; }
        function sair() { if(confirm("Encerrar Jesus?")) window.location.href = "about:blank"; }

        function atualizar() {
            fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                let totalAgora = 0;
                // Mapeia o estado recebido da API serverless
                for(let i = 1; i <= 50; i++) {
                    if (data[i] || data[`mesa_${i}`]) {
                        const item = data[i] || data[`mesa_${i}`];
                        estadoMesas[i] = {
                            ativa: item.status === 'waiting' || item.ativa,
                            acao: item.pedido || item.acao || 'CHAMADO',
                            quantidade: item.quantidade || 1
                        };
                    } else {
                        estadoMesas[i] = { ativa: false, acao: '', quantidade: 0 };
                    }
                    if(estadoMesas[i].ativa) totalAgora += estadoMesas[i].quantidade;
                }
                desenharGrade();
                if(totalAgora > ultimoTotal) { som.currentTime = 0; som.play().catch(() => {}); }
                ultimoTotal = totalAgora;
            })
            .catch(() => {
                // Em caso de erro de rede, garante que a grade de mesas continue visível
                desenharGrade();
            });
        }

        function atender(n) {
            fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ mesa: n, origem: 'painel', mensagem: 'O garçom está a caminho!' })
            }).then(atualizar);
        }

        function limpar(n) {
            fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ mesa: n, origem: 'clear' })
            }).then(atualizar);
        }

        // Desenha as mesas imediatamente ao abrir a página
        desenharGrade();
        setInterval(atualizar, 3000);
    </script>
</body>
</html>
