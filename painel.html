<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Gerente Controlador</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow-y: auto; }
        
        .grid-ampliado { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .grid-ampliado .m { height: 125px; }

        .grid-geral { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 5px; }
        .grid-geral .m { height: 85px; padding: 4px; }
        .grid-geral .m button { padding: 2px; font-size: 7px; }

        .m { background: #064e3b; border-radius: 8px; border: 1px solid #065f46; transition: all 0.2s ease; }
        .ativa { background: #b91c1c !important; border-color: #f87171; animation: pulse 1s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        #setup-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body class="p-4">
    <div id="setup-overlay" onclick="ativarPainel()">
        <div class="px-8 py-4 border-2 border-[#E6B952] rounded-full animate-pulse font-bold text-[#E6B952]">
            ATIVAR MONITORAMENTO E SOM
        </div>
    </div>

    <header class="flex justify-between items-center mb-4">
        <h1 class="text-xl font-bold uppercase">MAPA <span style="color:#E6B952">FATIAS CONTROL</span></h1>
        <div class="flex gap-2">
            <button id="btn-zoom" onclick="alternarZoom()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded text-xs font-bold flex items-center gap-1 transition">
                🔍 <span>Visão Geral</span>
            </button>
            <button onclick="sair()" class="bg-red-900 hover:bg-red-800 p-2 rounded text-xs font-bold">Sair</button>
        </div>
    </header>

    <div id="grid" class="grid-ampliado"></div>
    <audio id="som" src="alerta.mp3" preload="auto"></audio>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAf196vm_BP28YJWnATut2at74PfDqXleg",
            authDomain: "service-controll.firebaseapp.com",
            databaseURL: "https://service-controll-default-rtdb.firebaseio.com",
            projectId: "service-controll",
            storageBucket: "service-controll.firebasestorage.app",
            messagingSenderId: "568413588202",
            appId: "1:568413588202:web:a0fc12f49cc10bfc482593",
            measurementId: "G-9DJW6KWLFG"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let chamadosAtivos = {};
        let modoGeral = false;
        let totalChamadosAntigo = 0;
        const som = document.getElementById('som');

        function alternarZoom() {
            modoGeral = !modoGeral;
            const grid = document.getElementById('grid');
            const btn = document.getElementById('btn-zoom');
            grid.className = modoGeral ? "grid-geral" : "grid-ampliado";
            btn.innerHTML = modoGeral ? "🔍 <span>Ampliar</span>" : "🔍 <span>Visão Geral</span>";
            desenharGrade();
        }

        function desenharGrade() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            for(let i = 1; i <= 50; i++) {
                const c = chamadosAtivos[i];
                const estaAtiva = c && c.status === 'pendente';

                const div = document.createElement('div');
                div.className = `m p-2 flex flex-col items-center justify-between ${estaAtiva ? 'ativa' : ''}`;
                
                let textoAcao = c ? c.acao : '';
                let textoFicha = (c && c.ficha) ? `<span class="text-[9px] bg-black/60 px-1 rounded text-yellow-300 font-black">F: ${c.ficha}</span>` : '';

                div.innerHTML = `
                    <span class="text-[10px] font-bold">MESA ${i}</span>
                    ${estaAtiva ? `
                        <div class="text-center flex flex-col items-center">
                            <span class="text-[8px] uppercase font-bold">${textoAcao}</span>${textoFicha}
                        </div>
                        <div class="flex flex-col gap-1 w-full">
                            <button onclick="atender(${i})" class="bg-blue-600 text-[8px] p-1 rounded font-bold hover:bg-blue-500">OK</button>
                            <button onclick="limpar(${i})" class="bg-black text-[8px] p-1 rounded border border-gray-600 uppercase hover:bg-gray-800">Limpar</button>
                        </div>
                    ` : '<span class="text-[8px] opacity-40">LIVRE</span>'}
                `;
                grid.appendChild(div);
            }
        }

        function ativarPainel() {
            som.play().then(() => { som.pause(); som.currentTime = 0; }).catch(() => {});
            document.getElementById('setup-overlay').style.display = 'none';
            iniciarEscutaFirebase();
        }

        function sair() { if(confirm("Encerrar Painel?")) window.location.href = "about:blank"; }

        function iniciarEscutaFirebase() {
            db.ref('chamados').on('value', (snapshot) => {
                chamadosAtivos = snapshot.val() || {};
                
                let totalPendentes = 0;
                Object.values(chamadosAtivos).forEach(item => {
                    if (item.status === 'pendente') totalPendentes++;
                });

                if (totalPendentes > totalChamadosAntigo) {
                    som.currentTime = 0;
                    som.play().catch(() => {});
                }
                totalChamadosAntigo = totalPendentes;

                desenharGrade();
            });
        }

        function atender(numMesa) {
            db.ref('chamados/' + numMesa).update({ status: 'atendido' });
        }

        function limpar(numMesa) {
            db.ref('chamados/' + numMesa).remove();
        }

        desenharGrade();
    </script>
</body>
</html>
