<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel Jesus - Fatia's Control</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow-y: auto; }
        
        /* Classe Padrão: Cards com tamanho normal (Ampliado) */
        .grid-ampliado { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .grid-ampliado .m { height: 130px; }

        /* Classe Visão Geral: Cards menores para enxergar todas as mesas de uma vez */
        .grid-geral { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 5px; }
        .grid-geral .m { height: 85px; padding: 4px; }
        .grid-geral .m .btn-box { gap: 2px; }
        .grid-geral .m button { padding: 2px; font-size: 7px; }

        .m { background: #064e3b; border-radius: 8px; border: 1px solid #065f46; transition: all 0.2s ease; }
        .ativa { background: #b91c1c !important; border-color: #f87171; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        #setup-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body class="p-4">
    <div id="setup-overlay" onclick="ativarPainel()">
        <div class="px-8 py-4 border-2 border-[#E6B952] rounded-full animate-pulse font-bold text-[#E6B952]">
            ATIVAR MONITORAMENTO E SOM
        </div>
    </div>

    <header class="flex justify-between items-center mb-4">
        <h1 class="text-xl font-bold uppercase">MAPA <span style="color:#E6B952">FATIAS CONTROL</span></h1>
        <div class="flex gap-2">
            <!-- Botão único de Lupa com alternância de zoom -->
            <button id="btn-zoom" onclick="alternarZoom()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded text-xs font-bold flex items-center gap-1 transition">
                🔍 <span>Visão Geral</span>
            </button>
            <button onclick="sair()" class="bg-red-900 hover:bg-red-800 p-2 rounded text-xs font-bold">Sair</button>
        </div>
    </header>

    <div id="grid" class="grid-ampliado"></div>
    <audio id="som" src="alerta.mp3" preload="auto"></audio>

    <script>
        const API_URL = "/.netlify/functions/api";

        let estadoMesas = {};
        for(let i = 1; i <= 50; i++) {
            estadoMesas[i] = { ativa: false, acao: '', quantidade: 0 };
        }

        let ultimoTotal = 0;
        let modoGeral = false; // Alterna entre visão geral e ampliada
        const som = document.getElementById('som');

        function alternarZoom() {
            modoGeral = !modoGeral;
            const grid = document.getElementById('grid');
            const btn = document.getElementById('btn-zoom');
            
            if(modoGeral) {
                grid.className = "grid-geral";
                btn.innerHTML = "🔍 <span>Ampliar</span>";
            } else {
                grid.className = "grid-ampliado";
                btn.innerHTML = "🔍 <span>Visão Geral</span>";
            }
            desenharGrade();
        }

        function desenharGrade() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for(let i = 1; i <= 50; i++) {
                const m = estadoMesas[i] || { ativa: false, acao: '', quantidade: 0 };
                const div = document.createElement('div');
                div.className = `m p-2 flex flex-col items-center justify-between ${m.ativa ? 'ativa' : ''}`;
                div.innerHTML = `
                    <span class="text-[10px] font-bold">MESA ${i}</span>
                    ${m.ativa ? `
                        <span class="text-[8px] uppercase text-center font-bold">${m.acao}<br>(${m.quantidade}x)</span>
                        <div class="btn-box flex flex-col gap-1 w-full">
                            <button onclick="atender(${i})" class="bg-blue-600 text-[8px] p-1 rounded font-bold hover:bg-blue-500">OK</button>
                            <button onclick="limpar(${i})" class="bg-black text-[8px] p-1 rounded border border-gray-600 uppercase hover:bg-gray-800">Limpar</button>
                        </div>
                    ` : '<span class="text-[8px] opacity-40">LIVRE</span>'}
                `;
                grid.appendChild(div);
            }
        }

        function ativarPainel() { 
            som.play().then(() => { som.pause(); som.currentTime = 0; }).catch(() => {});
            document.getElementById('setup-overlay').style.display = 'none';
            atualizar();
        }

        function sair() { if(confirm("Encerrar Painel?")) window.location.href = "about:blank"; }

        function atualizar() {
            fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                let totalAgora = 0;
                for(let i = 1; i <= 50; i++) {
                    const item = data[i] || data[`mesa_${i}`];
                    if (item && item.status === 'waiting') {
                        estadoMesas[i] = {
                            ativa: true,
                            acao: item.pedido ? item.pedido.toUpperCase() : 'CHAMADO',
                            quantidade: 1
                        };
                        totalAgora += 1;
                    } else {
                        estadoMesas[i] = { ativa: false, acao: '', quantidade: 0 };
                    }
                }
                desenharGrade();
                if(totalAgora > ultimoTotal) { som.currentTime = 0; som.play().catch(() => {}); }
                ultimoTotal = totalAgora;
            })
            .catch(() => {
                desenharGrade();
            });
        }

        function atender(n) {
            fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ mesa: n, origem: 'painel', mensagem: 'O garçom está a caminho!' })
            }).then(atualizar);
        }

        function limpar(n) {
            fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ mesa: n, origem: 'clear' })
            }).then(atualizar);
        }

        desenharGrade();
        setInterval(atualizar, 3000);
    </script>
</body>
</html>
