<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <title>Fatia's Control - Cliente</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; display: flex; justify-content: center; align-items: center; font-family: 'Montserrat', sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
        .painel-container { background-image: url('fundo.jpg'); background-size: contain; background-repeat: no-repeat; background-position: center; width: 100vw; height: 100vh; position: relative; }
        .etiqueta-mesa { position: absolute; top: 32%; left: 14%; padding: 5px 12px; border: 2px solid #E6B952; border-radius: 10px; color: #E6B952; font-weight: 900; font-size: 13px; text-transform: uppercase; background: rgba(0,0,0,0.6); z-index: 15; display: flex; align-items: center; gap: 6px; }
        .grade-toque { position: absolute; top: 40%; bottom: 24%; left: 12%; right: 12%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 20px; z-index: 10; }
        .grade-rodape { position: absolute; bottom: 12%; left: 15%; right: 15%; height: 8%; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; z-index: 10; }
        .btn-acao { background: transparent; border: none; outline: none; cursor: pointer; display: block; width: 100%; height: 100%; -webkit-tap-highlight-color: transparent; }
        #notificacao-atendimento { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e40af; color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 5000; border: 2px solid #3b82f6; text-align: center; width: 85%; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { top: -100px; opacity: 0; } to { top: 20px; opacity: 1; } }
        #modal-wifi { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .balao-wifi { background: #111; border: 2px solid #E6B952; padding: 40px 20px; border-radius: 30px; text-align: center; color: white; width: 80%; }
        #overlay-inicio { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 8000; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); cursor: pointer; }
        .btn-iniciar-text { color: #E6B952; font-weight: 900; font-size: 28px; text-transform: uppercase; letter-spacing: 4px; animation: pulse-gold 2s infinite; }
        @keyframes pulse-gold { 0% { text-shadow: 0 0 10px rgba(230,185,82,0.2); transform: scale(1); } 50% { text-shadow: 0 0 25px rgba(230,185,82,0.7); transform: scale(1.05); } 100% { text-shadow: 0 0 10px rgba(230,185,82,0.2); transform: scale(1); } }
    </style>
</head>
<body>
    <div id="notificacao-atendimento"><span id="texto-feedback">--</span></div>
    
    <div id="overlay-inicio" onclick="solicitarPermissao()">
        <div class="text-center">
            <div class="btn-iniciar-text">INICIAR AGORA</div>
            <div class="mt-4 text-[#E6B952] font-bold">MESA <span id="label-mesa-inicio">--</span></div>
        </div>
    </div>

    <div class="painel-container">
        <div class="etiqueta-mesa">
            MESA: 
            <input type="number" id="input-num-mesa" maxlength="3" oninput="if(this.value.length > 3) this.value = this.value.slice(0, 3)" class="bg-black/70 text-[#E6B952] font-black w-14 text-center border border-[#E6B952]/50 rounded px-1 outline-none">
        </div>

        <div class="grade-toque">
            <button onclick="confirmarEnvio('Garçom')" class="btn-acao"></button>
            <button onclick="confirmarEnvio('Conta')" class="btn-acao"></button>
            <button onclick="abrirWifi()" class="btn-acao"></button>
            <a href="https://linktr.ee/Fatiasnatal" target="_blank" rel="noopener noreferrer" class="btn-acao"></a>
        </div>
        <div class="grade-rodape">
            <button onclick="sairSistema()" class="btn-acao"></button>
            <button onclick="minimizarSistema()" class="btn-acao"></button>
        </div>
    </div>

    <div id="modal-wifi">
        <div class="balao-wifi">
            <h2 class="text-[#E6B952] font-bold mb-4 uppercase">Wi-Fi Clientes</h2>
            <p class="text-xs">Rede: fatias cliente</p>
            <h1 class="text-3xl font-black text-[#E6B952] mb-8">fatias2025</h1>
            <button onclick="fecharWifi()" class="bg-white/10 text-white px-10 py-3 rounded-full text-xs font-bold uppercase border border-white/20">Fechar</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // CONFIGURAÇÕES DE GEOLOCALIZAÇÃO DO RESTAURANTE
        const LATITUDE_RESTAURANTE = -5.890425;  // Altere para a sua latitude
        const LONGITUDE_RESTAURANTE = -35.169790; // Altere para a sua longitude
        const RAIO_MAXIMO_METROS = 20;            // Distância máxima em metros

        const firebaseConfig = {
            apiKey: "AIzaSyAf196vm_BP28YJWnATut2at74PfDqXleg",
            authDomain: "service-controll.firebaseapp.com",
            databaseURL: "https://service-controll-default-rtdb.firebaseio.com",
            projectId: "service-controll",
            storageBucket: "service-controll.firebasestorage.app",
            messagingSenderId: "568413588202",
            appId: "1:568413588202:web:a0fc12f49cc10bfc482593",
            measurementId: "G-9DJW6KWLFG"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Fórmula para calcular distância GPS em metros (Haversine)
        function calcularDistanciaEmMetros(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Raio da Terra em metros
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const pathParts = window.location.pathname.split('/');
        let mesaURL = urlParams.get('mesa') || pathParts[pathParts.length - 1] || "1";
        mesaURL = parseInt(mesaURL) || 1;

        const inputMesa = document.getElementById('input-num-mesa');
        inputMesa.value = mesaURL;
        document.getElementById('label-mesa-inicio').innerText = mesaURL;

        inputMesa.addEventListener('change', () => {
            const novaMesa = parseInt(inputMesa.value) || 1;
            document.getElementById('label-mesa-inicio').innerText = novaMesa;
            ouvirRetornoMesa(novaMesa);
        });

        const somFeedback = new Audio('suave.mp3');
        let listenerAtivo = null;

        function solicitarPermissao() { iniciarSistema(); }
        function iniciarSistema() { 
            somFeedback.play().then(() => { somFeedback.pause(); somFeedback.currentTime = 0; }).catch(() => {}); 
            document.getElementById('overlay-inicio').style.display = 'none'; 
            ouvirRetornoMesa(parseInt(inputMesa.value));
        }
        function minimizarSistema() { document.getElementById('overlay-inicio').style.display = 'flex'; }
        function sairSistema() { if(confirm("Deseja encerrar o atendimento?")) window.location.href = "https://google.com"; }

        function confirmarEnvio(acao) {
            const numMesaAtual = parseInt(inputMesa.value) || 1;

            if(!navigator.geolocation) {
                alert("O seu navegador não suporta geolocalização. O chamado não pode ser enviado fora do local.");
                return;
            }

            // Pede o GPS do celular antes de disparar o chamado
            navigator.geolocation.getCurrentPosition(
                (posicao) => {
                    const latCliente = posicao.coords.latitude;
                    const lonCliente = posicao.coords.longitude;
                    const distancia = calcularDistanciaEmMetros(latCliente, lonCliente, LATITUDE_RESTAURANTE, LONGITUDE_RESTAURANTE);

                    if (distancia > RAIO_MAXIMO_METROS) {
                        alert(`Você está fora do restaurante (${Math.round(distancia)}m de distância). O chamado só é permitido dentro do local.`);
                        return;
                    }

                    if(confirm(`Confirmar chamado de ${acao} para a MESA ${numMesaAtual}?`)) {
                        const notif = document.getElementById('notificacao-atendimento');
                        document.getElementById('texto-feedback').innerText = "⏳ ENVIADO!";
                        notif.style.backgroundColor = "#1e40af";
                        notif.style.display = 'block';

                        db.ref('chamados/' + numMesaAtual).set({
                            mesa: numMesaAtual,
                            acao: acao,
                            status: 'pendente',
                            avulsa: numMesaAtual > 50,
                            timestamp: Date.now()
                        });
                    }
                },
                (erro) => {
                    alert("Acesso à localização negado. Ative o GPS no navegador para chamar o atendimento.");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function ouvirRetornoMesa(numMesa) {
            if(listenerAtivo) listenerAtivo.off();

            listenerAtivo = db.ref('chamados/' + numMesa);
            listenerAtivo.on('value', (snapshot) => {
                const data = snapshot.val();
                const notif = document.getElementById('notificacao-atendimento');

                if (data && data.status === 'atendido') {
                    somFeedback.play().catch(() => {});
                    const msg = (data.acao === "Garçom") ? "✅ O GARÇOM ESTÁ A CAMINHO!" : "✅ A CONTA ESTÁ VINDO!";
                    document.getElementById('texto-feedback').innerText = msg;
                    notif.style.backgroundColor = "#059669";
                    notif.style.display = 'block';

                    setTimeout(() => { 
                        notif.style.display = 'none'; 
                        db.ref('chamados/' + numMesa).remove();
                    }, 6000);
                }
            });
        }

        function abrirWifi() { document.getElementById('modal-wifi').style.display = 'flex'; }
        function fecharWifi() { document.getElementById('modal-wifi').style.display = 'none'; }
    </script>
</body>
</html>
